[package]
name = "pgwarc_lance"
version = "0.1.5"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "PostgreSQL extension (pgrx) providing BM25 + Lance vector hybrid search for WARC/web archive records"
readme = "README.md"
keywords = ["postgres", "postgresql", "pgrx", "bm25", "vector-search"]
categories = ["database"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg_test = []

[dependencies]
pgrx = "=0.19.1"
lance = { version = "7", default-features = false }
arrow = "58"
arrow-array = "58"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
futures = "0.3"

[dev-dependencies.pgrx-tests]
version = "=0.19.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
